services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms_agent_web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hms_app:hms_app_password@db:5432/hms_db
      - ADMIN_DATABASE_URL=postgresql://postgres:postgres@db:5432/hms_db
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey_replace_in_production_min_32_chars}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: hms_agent_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hms_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
